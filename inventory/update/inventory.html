<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Inventory</title><style>*{box-sizing:border-box;font-family:Arial,sans-serif}body{margin:0;background:#0d1117;color:#fff;display:grid;place-items:center;min-height:100vh;padding:20px}.card{width:100%;max-width:420px;background:#161b22;border:1px solid #30363d;border-radius:20px;padding:40px 30px;text-align:center}.logo{width:80px;height:80px;margin:auto auto 20px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:grid;place-items:center;font-size:38px}h1{font-size:28px;margin:0 0 8px}.version{color:#8b949e;margin-bottom:30px}.btn{width:100%;height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;cursor:pointer;text-decoration:none;margin-bottom:15px}.download{background:#238636;color:#fff}.copy{background:#21262d;color:#fff;border:1px solid #30363d}#status{color:#58a6ff;min-height:20px}.footer{margin-top:30px;color:#6e7681;font-size:13px}</style></head><body><div class="card"><div class="logo">⇧</div><h1 id="appName">Inventory</h1><p class="version" id="versionText">Checking latest version...</p><a class="btn download" id="downloadBtn" href="#">Download APK</a><button class="btn copy" id="copyBtn">Copy Download Link</button><p id="status"></p><div class="footer">Secure Direct Download</div></div><script>let downloadLink="";async function loadLatest(){const r=await fetch("latest.json?"+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("Waiting for automatic update...");const d=await r.json();if(!d.version||!d.file)throw new Error("Invalid update data");downloadLink=d.file;appName.textContent="Inventory "+d.version;versionText.textContent="Latest Android Build";downloadBtn.href=downloadLink}copyBtn.onclick=async()=>{if(!downloadLink)return;const u=new URL(downloadLink,location.href).href;try{await navigator.clipboard.writeText(u);status.textContent="Download link copied successfully."}catch{prompt("Copy this link:",u)}};loadLatest().catch(e=>{versionText.textContent="Unable to check latest version";status.textContent=e.message;downloadBtn.style.pointerEvents="none";downloadBtn.style.opacity=".6"});</script></body></html>
