<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Inventory</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,Arial,sans-serif}
body{background:#0d1117;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{width:100%;max-width:420px;background:#161b22;border:1px solid #30363d;border-radius:20px;padding:40px 30px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.45)}
.logo{width:80px;height:80px;margin:0 auto 20px;border-radius:18px;background:linear-gradient(135deg,#2563eb,#06b6d4);display:flex;align-items:center;justify-content:center}
.logo svg{width:40px;height:40px;fill:#fff}
h1{font-size:28px;margin-bottom:8px}
.version{color:#8b949e;margin-bottom:30px;font-size:15px}
.btn{width:100%;height:54px;border:none;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;margin-bottom:15px}
.download{background:#238636;color:#fff}.download:hover{background:#2ea043}
.copy{background:#21262d;color:#fff;border:1px solid #30363d}.copy:hover{background:#30363d}
.btn svg{width:20px;height:20px;fill:currentColor}
#status{margin-top:12px;color:#58a6ff;font-size:14px;min-height:20px}
.footer{margin-top:30px;color:#6e7681;font-size:13px}
</style>
</head>
<body>
<div class="card">
<div class="logo"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18l-5.5 5.5h3.5V15h4V7.5H17.5L12 2z"/></svg></div>
<h1 id="appName">Inventory</h1>
<p class="version" id="versionText">Checking latest version...</p>
<a class="btn download" id="downloadBtn" href="#"><svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2zm7-18v10.17l3.59-3.58L17 10l-5 5-5-5 1.41-1.41L11 12.17V2h1z"/></svg>Download APK</a>
<button class="btn copy" id="copyBtn" type="button"><svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v12h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>Copy Download Link</button>
<p id="status"></p>
<div class="footer">Secure Direct Download</div>
</div>
<script>
let downloadLink="";
const api="https://data.jsdelivr.com/v1/package/gh/gsmentech/updates@main";

function flatten(files,path=""){
let result=[];
for(const file of files||[]){
const full=path+"/"+file.name;
if(file.type==="directory")result=result.concat(flatten(file.files,full));
else result.push(full);
}
return result;
}

function versionOf(name){
const match=name.match(/^inventory(?:[-_]?)(\d+(?:\.\d+)*)\.apk$/i);
return match?match[1]:null;
}

function compareVersions(a,b){
const x=a.split(".").map(Number);
const y=b.split(".").map(Number);
for(let i=0;i<Math.max(x.length,y.length);i++){
const diff=(x[i]||0)-(y[i]||0);
if(diff!==0)return diff;
}
return 0;
}

async function loadLatest(){
const response=await fetch(api,{cache:"no-store"});
if(!response.ok)throw new Error("Unable to read update folder: "+response.status);

const data=await response.json();
const files=flatten(data.files).filter(path=>path.startsWith("/inventory/update/"));

const apks=files.map(path=>{
const name=path.split("/").pop();
return{path,name,version:versionOf(name)};
}).filter(item=>item.version);

if(!apks.length)throw new Error("No APK found");

apks.sort((a,b)=>compareVersions(b.version,a.version));
const latest=apks[0];

downloadLink="https://cdn.jsdelivr.net/gh/gsmentech/updates@main"+latest.path;

document.getElementById("appName").textContent="Inventory "+latest.version;
document.getElementById("versionText").textContent="Latest Android Build";
document.getElementById("downloadBtn").href=downloadLink;
document.getElementById("status").textContent="";
}

document.getElementById("copyBtn").addEventListener("click",()=>{
if(!downloadLink)return;
navigator.clipboard.writeText(downloadLink).then(()=>{
document.getElementById("status").textContent="Download link copied successfully.";
}).catch(()=>prompt("Copy this link:",downloadLink));
});

loadLatest().catch(error=>{
document.getElementById("versionText").textContent="Unable to check latest version";
document.getElementById("status").textContent=error.message;
document.getElementById("downloadBtn").style.pointerEvents="none";
document.getElementById("downloadBtn").style.opacity=".6";
});
</script>
</body>
</html>
